name: 打包Windows exe

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy flask-login flask-wtf wtforms
          pip install openpyxl pandas bcrypt pywebview
          pip install pyinstaller

      - name: 使用 build.spec 打包
        run: |
          python -c "import os, sys; f=open('build.spec','r',encoding='utf-8').read(); f=f.replace(\"console=True\",\"console=False\"); open('build_win.spec','w',encoding='utf-8').write(f)"
          pyinstaller build_win.spec

      - name: 打包为zip上传
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "大理州动物防疫物资管理软件_Windows.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 大理州动物防疫物资管理软件_Windows版
          path: 大理州动物防疫物资管理软件_Windows.zip
