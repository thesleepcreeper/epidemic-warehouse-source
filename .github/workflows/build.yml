name: 打包发布

on:
  push:
    tags:
      - 'v*'      # 打 v2.0 / v2.1 等tag时触发

jobs:
  build-linux:
    name: Linux 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev patchelf

      - name: 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: |
          pyinstaller build.spec
          # 压缩打包结果
          cd dist
          tar czf ../epidemic-warehouse-linux-x86_64.tar.gz ./*
          cd ..

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: epidemic-warehouse-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS 打包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: |
          pyinstaller build.spec
          cd dist
          tar czf ../epidemic-warehouse-macos-arm64.tar.gz ./*
          cd ..

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: epidemic-warehouse-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
